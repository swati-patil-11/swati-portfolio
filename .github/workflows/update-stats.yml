name: Update coding stats
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-stats.js"
      - "data/config.js"
      - ".github/workflows/update-stats.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node scripts/fetch-stats.js
      - name: Commit stats if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "chore: update coding stats"
          git push
